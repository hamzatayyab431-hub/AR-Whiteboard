services:
  ar-whiteboard:
    container_name: ar_whiteboard_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database file
      - ./ar_whiteboard.db:/app/ar_whiteboard.db
      # Persist exported media session files
      - whiteboard_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/ar_whiteboard.db
      - OCR_ENGINE=easyocr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  whiteboard_data:
